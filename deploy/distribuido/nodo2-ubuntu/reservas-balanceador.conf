# Apache: punto de entrada de la UI. Balancea entre los 2 Tomcat de UI con sticky sessions
# y reenvía /api al API Gateway del nodo 1 (@NODE1_IP@ lo reemplaza instalar-nodo2.sh).

<VirtualHost *:80>
    ServerName reservas.local

    # --- Monitoreo ---------------------------------------------------------------
    # mod_status: estado del servidor y de los workers del balanceador en tiempo real
    <Location "/server-status">
        SetHandler server-status
        Require all granted
    </Location>
    # Estado de cada Tomcat (Ok / Err / Init), pedidos atendidos, y permite deshabilitar uno
    <Location "/balancer-manager">
        SetHandler balancer-manager
        Require all granted
    </Location>
    ProxyPass /server-status !
    ProxyPass /balancer-manager !

    # --- API: todo /api va al API Gateway (nodo 1) ---------------------------------
    ProxyPass        /api/ http://@NODE1_IP@:8080/ connectiontimeout=3 timeout=30
    ProxyPassReverse /api/ http://@NODE1_IP@:8080/

    # --- UI: cluster de Tomcat ---------------------------------------------------
    # route = jvmRoute de cada Tomcat. stickysession lee el sufijo de JSESSIONID (ABC.ui1).
    # hc*: mod_proxy_hcheck consulta /health.txt cada 3 s; un nodo caído se marca en error y
    # el tráfico pasa al otro sin que el usuario lo note. retry: cada cuánto reintentar el caído.
    <Proxy "balancer://ui-cluster">
        BalancerMember "http://127.0.0.1:8181" route=ui1 retry=5 connectiontimeout=2 hcmethod=GET hcuri=/health.txt hcinterval=3 hcpasses=1 hcfails=1
        BalancerMember "http://127.0.0.1:8182" route=ui2 retry=5 connectiontimeout=2 hcmethod=GET hcuri=/health.txt hcinterval=3 hcpasses=1 hcfails=1
        ProxySet lbmethod=byrequests stickysession=JSESSIONID|jsessionid nofailover=Off
    </Proxy>
    ProxyPass        "/" "balancer://ui-cluster/"
    ProxyPassReverse "/" "balancer://ui-cluster/"

    # Cabecera de diagnóstico: qué Tomcat atendió cada pedido (visible en DevTools > Network)
    Header always set X-UI-Node "%{BALANCER_WORKER_ROUTE}e" env=BALANCER_WORKER_ROUTE

    ErrorLog ${APACHE_LOG_DIR}/reservas-error.log
    CustomLog ${APACHE_LOG_DIR}/reservas-access.log "%h %t \"%r\" %>s %b route=%{BALANCER_WORKER_ROUTE}e sticky=%{BALANCER_SESSION_STICKY}e"
</VirtualHost>
